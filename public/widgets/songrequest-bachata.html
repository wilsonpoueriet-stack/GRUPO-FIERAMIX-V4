<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solicita tu canción — Solo Bachata</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b19;
      --panel: #0d122a;
      --line: rgba(255,255,255,.12);
      --muted: #aeb7d7;
      --accent: #ff2d76;
      --accent2: #8b5cf6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    body { padding: 2px; }

    .rbcloud_songrequest {
      width: 100%;
      color: #fff;
    }

    .rbcloud_songrequest .rbc_search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .rbcloud_songrequest input,
    .rbcloud_songrequest button {
      min-height: 48px;
      border-radius: 12px;
      font: inherit;
    }

    .rbcloud_songrequest input {
      width: 100%;
      min-width: 0;
      padding: 0 14px;
      color: #fff;
      background: #060916;
      border: 1px solid var(--line);
      outline: none;
    }

    .rbcloud_songrequest input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,45,118,.13);
    }

    .rbcloud_songrequest button {
      padding: 0 18px;
      color: #fff;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 0;
      cursor: pointer;
    }

    .rbcloud_songrequest .rbc_result {
      display: none;
      margin-top: 12px;
      padding: 0 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .rbcloud_songrequest .rbc_result_item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
    }

    .rbcloud_songrequest .rbc_result_item:not(:last-child) {
      border-bottom: 1px solid var(--line);
    }

    .rbcloud_songrequest .rbc_result_item div:first-child {
      flex: 1;
      min-width: 0;
      padding-right: 5px;
      word-break: break-word;
    }

    .rbcloud_songrequest .rbc_result_item button {
      min-height: 36px;
      padding: 0 12px;
      font-size: .75rem;
    }

    @media (max-width: 620px) {
      .rbcloud_songrequest .rbc_search {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="rbcloud_songrequest" id="rbcloud_songrequest7164">
    <div class="rbc_search">
      <input class="rbc_ed_query" placeholder="Busca artista o canción..." />
      <button class="rbc_bt_search" type="button">🔎 Buscar</button>
    </div>
    <div class="rbc_result"></div>
  </div>

  <script>
    window.rbcloudSongRequest7164 = {
      requestBtn: "Solicitar",
      requested: "¡Tu canción fue solicitada correctamente!",
      noTracks: "No encontramos canciones con esa búsqueda.",
      errors: {
        1: "Escribe al menos tres caracteres.",
        2: "No fue posible cargar las canciones.",
        3: "Las solicitudes están desactivadas temporalmente.",
        4: "Espera un momento e inténtalo nuevamente.",
        5: "La canción no está disponible.",
        6: "No fue posible solicitar la canción."
      }
    };
  </script>

  <script src="https://c15.radioboss.fm/w/songrequest.js?u=221&amp;wid=7164"></script>

  <script>
    function reportHeight() {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        120
      );
      parent.postMessage(
        { type: "fieramix-songrequest-height", height },
        window.location.origin
      );
    }

    window.addEventListener("load", reportHeight);
    new MutationObserver(reportHeight).observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true
    });
  </script>
</body>
</html>
